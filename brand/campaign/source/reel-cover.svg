<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Still - reel cover</title><desc id="desc">Portada vertical con zona segura central para Reels.</desc>
  <rect width="1080" height="1920" fill="#171814"/>
  <text x="72" y="132" fill="#9CB8FF" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="24" letter-spacing="4">STILL / REGISTRO 01</text><line x1="72" y1="270" x2="1008" y2="270" stroke="#F3F0E8" stroke-width="3"/>
  <text x="72" y="650" fill="#F3F0E8" font-family="Familjen Grotesk,Arial,sans-serif" font-weight="700" font-size="132" letter-spacing="-6">Tu día,</text><text x="72" y="780" fill="#F3F0E8" font-family="Familjen Grotesk,Arial,sans-serif" font-weight="700" font-size="132" letter-spacing="-6">sin una nota.</text>
  <g transform="translate(72 940)"><line x1="0" y1="0" x2="392" y2="0" stroke="#F3F0E8" stroke-width="10"/><line x1="462" y1="0" x2="936" y2="0" stroke="#F3F0E8" stroke-width="10"/><rect x="402" y="-42" width="50" height="84" fill="#FF5C35"/></g>
  <text x="72" y="1178" fill="#9CB8FF" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="31" letter-spacing="4">18 ENTRADAS EVITADAS</text><text x="72" y="1245" fill="#F3F0E8" font-family="Familjen Grotesk,Arial,sans-serif" font-size="42">Un hecho. No una puntuación.</text>
  <line x1="72" y1="1630" x2="1008" y2="1630" stroke="#F3F0E8" stroke-width="3"/><text x="72" y="1780" fill="#F3F0E8" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="28" letter-spacing="4">UNA PAUSA QUE CUENTA.</text>
</svg>
